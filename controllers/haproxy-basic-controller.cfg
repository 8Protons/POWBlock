frontend edge_ingress
    #bind :443 ssl crt /etc/haproxy/certs/your_cert.pem
    bind :8080
    mode http

    # Security & Client-Side Timeouts
    timeout http-request    10s    # Protects against Slowloris attacks (header deadline)
    timeout client          50s    # Maximum client inactivity time during data transfer
    timeout http-keep-alive 4s     # Time to keep idle connection open for subsequent requests

    # -------------------------------------------------------------------------
    # 1. PREVENT SPOOFING: Clear control headers right at the ingress gate
    # -------------------------------------------------------------------------
    http-request del-header X-PoW-Expected
    http-request del-header X-PoW-Token
    http-request del-header X-Original-URL
    http-request del-header X-Client-IP
    http-request del-header X-PoW-Secret

    # Set the proto header explicitly if HAProxy terminates the TLS layer here
    http-request set-header X-Forwarded-Proto https

    # -------------------------------------------------------------------------
    # 2. CALCULATION: Compute the expected token natively using OpenSSL digests.
    #    We concatenate the genuine client IP and the Secret key,
    #    pass it into the sha256 converter, and store it as a transaction variable.
    # -------------------------------------------------------------------------

    # THE MAGIC KEY - ROTATE THE STRING INSIDE THE () OCCASIONALLY
    http-request set-var(txn.pow_secret)   str(xxxyyyzzz123123aaaaaaaaaaaaabbbbbbbbbbbbbbbbb0000000000000000)
    
    # Step A: Combine the IP and the Secret into a pure raw string variable
    http-request set-var-fmt(txn.pow_raw)  %[src]%[var(txn.pow_secret)]
    
    # Step B: Fetch the raw string variable, apply converters, and store the hash
    http-request set-var(txn.pow_expected) var(txn.pow_raw),digest(sha256),hex,lower

    # -------------------------------------------------------------------------
    # 3. EXTRACTION: Pull the client's token value directly from the cookie array
    # -------------------------------------------------------------------------
    http-request set-var(txn.pow_token)    req.cook(POW_TOKEN)

    # -------------------------------------------------------------------------
    # 4. CONDITIONAL ROUTING: Fallback to POWBlock if missing or mismatched
    # -------------------------------------------------------------------------
    # Define an ACL that verifies if the provided token matches the expected hash
    # We use strcmp to compare the two transaction variables natively as strings.
    # If the comparison equals 0, the strings match perfectly.
    acl token_is_valid var(txn.pow_token),strcmp(txn.pow_expected) eq 0


    # If the token is invalid or missing, prep the required headers and forward to POWBlock 
    http-request set-header X-Original-URL %[url] if !token_is_valid
    http-request set-header X-Client-IP     %[src]  if !token_is_valid
    http-request set-header X-PoW-Expected  %[var(txn.pow_expected)] if !token_is_valid
    http-request set-header X-PoW-Secret    %[var(txn.pow_secret)]   if !token_is_valid
    
    use_backend powblock_backend if !token_is_valid

    # -------------------------------------------------------------------------
    # 5. VALID CLIENT: If token checks out, proceed to the website origin
    # -------------------------------------------------------------------------

    default_backend origin_backend


# =============================================================================
# BACKEND DESTINATIONS
# =============================================================================
backend origin_backend
    mode http
    balance roundrobin

    # Set up your real origin backend IP and port here
    server origin1 127.0.0.1:9010 check

    # Routing, Queueing & App-Side Timeouts
    timeout connect         5s     # Max time allowed to establish a TCP handshake to a server
    timeout server          50s    # Max time allowed for the app server to process a request
    timeout queue           30s    # Max time a request can sit in the queue waiting for a free slot
    timeout check           5s     # Max time allowed for a server health check to respond

backend powblock_backend
    mode http

    # Routes internally to POWBlock
    server powblock 127.0.0.1:9001 check

    # Routing, Queueing & App-Side Timeouts
    timeout connect         5s     # Max time allowed to establish a TCP handshake to a server
    timeout server          50s    # Max time allowed for the app server to process a request
    timeout queue           30s    # Max time a request can sit in the queue waiting for a free slot
    timeout check           5s     # Max time allowed for a server health check to respond
