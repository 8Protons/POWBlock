<!DOCTYPE html><html><head><meta charset=utf-8><meta http-equiv="Cache-Control" content="private,no-store,no-cache,must-revalidate,max-age=0"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="Thu,01 Jan 1970 00:00:00 GMT"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>POWBlock 確認中…</title><style>body{font:18px system-ui;background:#f8f9fa;display:grid;place-items:center;height:100vh;margin:0;color:#111}.b{background:#fff;padding:2rem 3rem;border-radius:16px;box-shadow:0 10px 40px #0002;text-align:center;max-width:420px}.s{width:56px;height:56px;border:6px solid #e2e8f0;border-top:6px solid #0066ff;border-radius:50%;animation:s 1s linear infinite;margin:1.5rem auto}.logo{display:block;margin:1.5rem auto 0 auto;width:64px;height:64px}.footer{text-align:center;margin-top:0.5rem;font-size:0.8rem;color:#555}.progress-container{margin:1.5rem auto;width:80%;max-width:300px}.progress-bar{height:8px;background:#e2e8f0;border-radius:4px;overflow:hidden}.progress-fill{height:100%;width:0%;background:linear-gradient(90deg,#0066ff,#3399ff);transition:width 0.4s ease-out}.progress-text{font-size:0.9rem;margin-top:0.5rem;color:#555}@keyframes s{to{transform:rotate(360deg)}}@media (prefers-color-scheme:dark){body{background:#111;color:#eee}.b{background:#1e1e1e;box-shadow:0 10px 40px #0008}.s{border:6px solid #444;border-top:6px solid #3399ff}.footer{color:#aaa}.progress-bar{background:#444}.progress-text{color:#aaa}}</style></head><body><div class=b><h1>少々お待ちください…</h1><p>ブラウザを確認しています…</p><div class=s></div><img class=logo src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABAAgMAAADXB5lNAAAADFBMVEUAAABEKyPt3MT3Px7hdKnDAAAAAXRSTlMAQObYZgAAAEdJREFUOMvN08ENACAIQ1GW7JJdUos3rpQEv0aTd4YIlKIDOCWsQa0HJPVTN08TRKk+wAOOAGyASqXahvfK0AN/xr7Zl4Hdv7E6Nzs6NzEGAAAAAElFTkSuQmCC" alt=Logo><div class="progress-container"><div class="progress-bar"><div class="progress-fill" id=progressFill></div></div><div class="progress-text" id=progressText>JavaScriptとCookieが必要です。</div></div><div class=footer>POWBlock v1.8x エンタープライズ特別版</div><pre id=c style=display:none>%s</pre><pre id=d style=display:none>%d</pre><pre id=h style=display:none>%d</pre><script>async function go(){try{const tokenElem=document.getElementById('c');if(!tokenElem||tokenElem.textContent.trim().length<60){console.error("Missing token");setTimeout(()=>location.reload(true),500);return}const token=tokenElem.textContent.trim();const diff=parseInt(document.getElementById('d').textContent)||17;const algo=parseInt(document.getElementById('h').textContent)||256;const hashName=algo===512?'SHA-512':'SHA-256';const hashBytes=algo===512?64:32;console.log(`[JS] Starting PoW - Difficulty: ${diff}, Token length: ${token.length}`);const originalUrl=window.location.pathname+(window.location.search||'')+(window.location.hash||'');const progressFill=document.getElementById('progressFill');const progressText=document.getElementById('progressText');const expectedAttempts=Math.pow(2,diff);let attempts=0;const startTime=Date.now();async function detectHeadless(){return navigator.webdriver||navigator.userAgent.includes('HeadlessChrome')}const isHeadless=await detectHeadless();let n=0;let isMiningActive=false;const lockKey='pow_lock_'+token;const solutionKey='pow_sol_'+token;try{for(let i=localStorage.length-1;i>=0;i--){const key=localStorage.key(i);if(key&&key.indexOf('pow_')===0&&key!==lockKey&&key!==solutionKey){localStorage.removeItem(key)}}}catch(e){}let lockInterval=null;function executeRedirect(nonce){if(lockInterval)clearInterval(lockInterval);progressFill.style.width='100%';progressText.textContent='Verifying solution…';const url=new URL(window.location.href);url.searchParams.delete('powblock');url.searchParams.delete('pbchal');let query=url.searchParams.toString();if(query)query+='&';query+='powblock='+nonce+'&pbchal='+token;const solutionUrl=url.pathname+(query?'?'+query:'')+url.hash;setTimeout(()=>{progressText.textContent='Success! Redirecting…';window.location.replace(solutionUrl);setTimeout(()=>{if(window.location.search.indexOf('powblock=')===-1){window.location.replace(originalUrl)}},7000)},1000)}window.addEventListener('storage',function(e){if(e.key===solutionKey&&e.newValue&&!isMiningActive){progressFill.style.width='100%';progressText.textContent='Solved by another tab! Synchronizing…';setTimeout(()=>{window.location.replace(originalUrl)},8000)}});const encoder=new TextEncoder();const BATCH_SIZE=150;const sleep=ms=>new Promise(res=>setTimeout(res,ms));async function loopChunk(){if(!isMiningActive){const currentLock=localStorage.getItem(lockKey);const now=Date.now();if(!currentLock||(now-parseInt(currentLock))>8000){const tabId=Math.random().toString(36).substring(2);localStorage.setItem(lockKey,now.toString()+'|'+tabId);await sleep(35);const verifyLock=localStorage.getItem(lockKey)||'';if(!verifyLock.endsWith(tabId)){const jitterDelay=200+Math.floor(Math.random()*250);setTimeout(loopChunk,jitterDelay);return}isMiningActive=true;lockInterval=setInterval(()=>{localStorage.setItem(lockKey,Date.now().toString()+'|'+tabId)},3500);console.log('[Tabs] Computing lock cleanly acquired locally.')}else{if(localStorage.getItem(solutionKey)){progressFill.style.width='100%';progressText.textContent='Solved by another tab! Synchronizing…';setTimeout(()=>{window.location.replace(originalUrl)},8000);return}progressText.textContent='Waiting for background check…';progressFill.style.width='10%';const jitterDelay=200+Math.floor(Math.random()*250);setTimeout(loopChunk,jitterDelay);return}}const batchPromises=[];const startN=n;for(let k=0;k<BATCH_SIZE;k++){const msg=token+(startN+k);batchPromises.push(crypto.subtle.digest(hashName,encoder.encode(msg)))}const buffers=await Promise.all(batchPromises);for(let k=0;k<BATCH_SIZE;k++){const h=new Uint8Array(buffers[k]);let bits=0;outer:for(let i=0;i<hashBytes;i++){const byte=h[i];if(byte===0){bits+=8;if(bits>=diff){bits=diff;break outer}}else{const leadingZeros=Math.clz32(byte<<24);bits+=leadingZeros;break outer}}attempts++;n++;if(bits>=diff){if(isHeadless)continue;console.log('PoW solved locally. Broadcasting solution to all tabs.');localStorage.setItem(solutionKey,(startN+k).toString());executeRedirect(startN+k);return}}if(attempts%600===0){let percent=(attempts/expectedAttempts)*100;percent=Math.min(97,percent*0.65);progressFill.style.width=percent+'%';const elapsed=((Date.now()-startTime)/1000).toFixed(1);progressText.textContent=`${percent.toFixed(0)}% • ${attempts.toLocaleString()} attempts • ${elapsed}s`}setTimeout(loopChunk,0)}loopChunk()}catch(e){console.error("Error in PoW solver:",e);document.getElementById('progressText').textContent="Error - reloading...";setTimeout(()=>location.reload(true),1000)}}onload=go;</script></div></body></html>
